<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepadi | Realtime Notepad</title>
</head>
<body>
    <h1>Notepadi</h1>
    <textarea id="note" rows="10" cols="50" placeholder="Start typing..."></textarea>
    <br>
    <button id="addPasswordBtn">+ Add Password</button>
    <div id="passwordContainer"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const noteField = document.getElementById('note');
        const noteId = 'note1';
        let saveTimeout;

        socket.on('loadNotes', (notes) => {
            if (notes.text) {
                noteField.value = notes.text;
            }
            if (notes.passwords) {
                notes.passwords.forEach(password => {
                    addPasswordSection(password.id, password.title, password.username, password.password);
                });
            }
        });

        noteField.addEventListener('keyup', () => {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const content = noteField.value;
                socket.emit('saveNote', { id: noteId, content });
            }, 1000);
        });

        document.getElementById('addPasswordBtn').addEventListener('click', () => {
            addPasswordSection();
        });

        function addPasswordSection(id = null, title = '', username = '', password = '') {
            const container = document.getElementById('passwordContainer');
            const passwordSection = document.createElement('div');
            const uniqueId = id || Date.now().toString();

            passwordSection.innerHTML = `
                <input type="text" placeholder="Title (optional)" value="${title}">
                <input type="text" placeholder="Username/Email/Phone" value="${username}" required>
                <input type="password" placeholder="Password" value="${password}" required>
                <button class="deleteBtn">Delete</button>
                <br><br>
            `;

            container.appendChild(passwordSection);

            const inputs = passwordSection.querySelectorAll('input');
            const deleteBtn = passwordSection.querySelector('.deleteBtn');

            const saveData = () => {
                const data = {
                    id: uniqueId,
                    title: inputs[0].value,
                    username: inputs[1].value,
                    password: inputs[2].value
                };
                socket.emit('savePassword', data);
            };

            inputs.forEach(input => {
                input.addEventListener('keyup', () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(saveData, 1000);
                });
            });

            deleteBtn.addEventListener('click', () => {
                socket.emit('deletePassword', uniqueId);
            });
        }

        socket.on('passwordUpdated', (data) => {
            const container = document.getElementById('passwordContainer');
            const existingSections = container.children;
            let sectionFound = false;
            Array.from(existingSections).forEach((section, index) => {
                if (section.querySelectorAll('input')[0].value === data.id) {
                    const inputs = section.querySelectorAll('input');
                    inputs[0].value = data.title;
                    inputs[1].value = data.username;
                    inputs[2].value = data.password;
                    sectionFound = true;
                }
            });

            if (!sectionFound) {
                addPasswordSection(data.id, data.title, data.username, data.password);
            }
        });

        socket.on('passwordDeleted', (id) => {
            const container = document.getElementById('passwordContainer');
            Array.from(container.children).forEach(section => {
                if (section.querySelectorAll('input')[0].value === id) {
                    container.removeChild(section);
                }
            });
        });
    </script>
</body>
</html>
