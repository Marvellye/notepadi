<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepadi | Realtime Notepad</title>
</head>
<body>
    <h1>Notepadi</h1>
    <textarea id="note" rows="10" cols="50" placeholder="Start typing..."></textarea>
    <br>
    <button id="addPasswordBtn">+ Add Password</button>
    <button id="refreshPasswordsBtn">Refresh Passwords</button>
    <div id="passwordContainer"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const noteField = document.getElementById('note');
        const noteId = 'note1';

        socket.on('loadNotes', (notes) => {
            if (notes.text) {
                noteField.value = notes.text;
            }
            if (notes.passwords) {
                const container = document.getElementById('passwordContainer');
                container.innerHTML = '';
                notes.passwords.forEach(password => {
                    addPasswordSection(password.id, password.title, password.username, password.password, false);
                });
            }
        });

        noteField.addEventListener('keyup', () => {
            const content = noteField.value;
            socket.emit('saveNote', { id: noteId, content });
        });

        document.getElementById('addPasswordBtn').addEventListener('click', () => {
            addPasswordSection();
        });

        document.getElementById('refreshPasswordsBtn').addEventListener('click', () => {
            socket.emit('refreshPasswords');
        });

        function addPasswordSection(id = null, title = '', username = '', password = '', isEditable = true) {
            const container = document.getElementById('passwordContainer');
            const passwordSection = document.createElement('div');
            const uniqueId = id || Date.now().toString();

            passwordSection.innerHTML = `
                <input type="text" placeholder="Title (optional)" value="${title}" ${!isEditable ? 'readonly' : ''}>
                <input type="text" placeholder="Username/Email/Phone" value="${username}" required ${!isEditable ? 'readonly' : ''}>
                <input type="password" placeholder="Password" value="${password}" required ${!isEditable ? 'readonly' : ''}>
                <button class="saveBtn" ${!isEditable ? 'style="display:none;"' : ''}>Save</button>
                <button class="editBtn" ${isEditable ? 'style="display:none;"' : ''}>Edit</button>
                <button class="deleteBtn">Delete</button>
                <br><br>
            `;

            container.appendChild(passwordSection);

            const inputs = passwordSection.querySelectorAll('input');
            const saveBtn = passwordSection.querySelector('.saveBtn');
            const editBtn = passwordSection.querySelector('.editBtn');
            const deleteBtn = passwordSection.querySelector('.deleteBtn');

            saveBtn.addEventListener('click', () => {
                const data = {
                    id: uniqueId,
                    title: inputs[0].value,
                    username: inputs[1].value,
                    password: inputs[2].value
                };
                socket.emit('savePassword', data);
                toggleEditable(passwordSection, false);
            });

            editBtn.addEventListener('click', () => {
                toggleEditable(passwordSection, true);
            });

            deleteBtn.addEventListener('click', () => {
                socket.emit('deletePassword', uniqueId);
                container.removeChild(passwordSection);
            });
        }

        function toggleEditable(section, isEditable) {
            const inputs = section.querySelectorAll('input');
            const saveBtn = section.querySelector('.saveBtn');
            const editBtn = section.querySelector('.editBtn');

            inputs.forEach(input => {
                input.readOnly = !isEditable;
            });

            saveBtn.style.display = isEditable ? 'inline' : 'none';
            editBtn.style.display = isEditable ? 'none' : 'inline';
        }

        socket.on('passwordUpdated', (data) => {
            const container = document.getElementById('passwordContainer');
            const existingSections = container.children;
            Array.from(existingSections).forEach(section => {
                const inputs = section.querySelectorAll('input');
                if (inputs[0].value === data.title && inputs[1].value === data.username && inputs[2].value === data.password) {
                    toggleEditable(section, false);
                }
            });
        });

        socket.on('passwordDeleted', (id) => {
            const container = document.getElementById('passwordContainer');
            Array.from(container.children).forEach(section => {
                const inputs = section.querySelectorAll('input');
                if (inputs[0].value === id) {
                    container.removeChild(section);
                }
            });
        });
    </script>
</body>
</html>
