<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepadi | Realtime Notepad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin-top: 20px;
        }
        .password-section {
            margin-bottom: 20px;
        }
        .password-section input {
            margin-right: 10px;
        }
        .btn-custom {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Notepadi</h1>

        <!-- Quicknote Section -->
        <div class="mb-4">
            <h2>Quicknote</h2>
            <div class="input-group mb-2">
                <textarea id="quicknote" class="form-control" rows="5" placeholder="Start typing..."></textarea>
                <button id="copyQuicknoteBtn" class="btn btn-primary btn-custom">Copy</button>
                <button id="resetQuicknoteBtn" class="btn btn-secondary btn-custom">Reset Text</button>
            </div>
        </div>

        <!-- Password Section -->
        <div>
            <h2>Password Section</h2>
            <button id="addPasswordBtn" class="btn btn-success mb-2">+ Add Password</button>
            <div id="passwordContainer" class="password-section"></div>
            <button id="refreshPasswordsBtn" class="btn btn-info">Refresh</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uuid@8.3.2/dist/umd/uuid.min.js"></script>
    <script>
        const socket = io();
        let quicknoteTimeout;

        // Quicknote handling
        const quicknoteField = document.getElementById('quicknote');

        // Listen for Quicknote updates from the server
        socket.on('quicknoteUpdated', (content) => {
            if (quicknoteField.value === content) return; // Avoid updating if it’s the same content
            quicknoteField.value = content;
        });

        socket.on('quicknoteReset', () => {
            quicknoteField.value = '';
        });

        quicknoteField.addEventListener('keyup', () => {
            if (quicknoteTimeout) clearTimeout(quicknoteTimeout);
            quicknoteTimeout = setTimeout(() => {
                const content = quicknoteField.value;
                socket.emit('saveQuickNote', { content });
            }, 700); // Adjust latency here
        });

        document.getElementById('resetQuicknoteBtn').addEventListener('click', () => {
            socket.emit('resetQuickNote');
        });

        document.getElementById('copyQuicknoteBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(quicknoteField.value)
                .then(() => alert('Quicknote copied to clipboard!'))
                .catch(err => alert('Failed to copy quicknote: ' + err));
        });

        // Password handling
        document.getElementById('addPasswordBtn').addEventListener('click', () => {
            addPasswordSection();
        });

        document.getElementById('refreshPasswordsBtn').addEventListener('click', () => {
            socket.emit('loadData');
        });

        socket.on('passwordUpdated', (data) => {
            const section = document.querySelector(`[data-password-id="${data.id}"]`);
            if (section) {
                section.querySelector('input:nth-child(1)').value = data.title;
                section.querySelector('input:nth-child(2)').value = data.username;
                section.querySelector('input:nth-child(3)').value = data.password;
            } else {
                addPasswordSection(data.id, data.title, data.username, data.password, false);
            }
        });

        socket.on('passwordDeleted', (id) => {
            document.querySelector(`[data-password-id="${id}"]`).remove();
        });

        function addPasswordSection(id = null, title = '', username = '', password = '', isEditable = true) {
            const container = document.getElementById('passwordContainer');
            const uniqueId = id || uuid.v4();
            const passwordSection = document.createElement('div');

            passwordSection.dataset.passwordId = uniqueId;
            passwordSection.classList.add('password-section');
            passwordSection.innerHTML = `
                <input type="text" class="form-control mb-2" placeholder="Title (optional)" value="${title}" ${!isEditable ? 'readonly' : ''}>
                <input type="text" class="form-control mb-2" placeholder="Username/Email/Phone" value="${username}" ${!isEditable ? 'readonly' : ''} required>
                <input type="text" class="form-control mb-2" placeholder="Password" value="${password}" ${!isEditable ? 'readonly' : ''} required>
                <button class="savePasswordBtn btn btn-primary btn-custom" ${!isEditable ? 'style="display:none;"' : ''}>Save</button>
                <button class="editPasswordBtn btn btn-secondary btn-custom" ${isEditable ? 'style="display:none;"' : ''}>Edit</button>
                <button class="deletePasswordBtn btn btn-danger btn-custom">Delete</button>
                <br>
            `;

            container.appendChild(passwordSection);

            const savePasswordBtn = passwordSection.querySelector('.savePasswordBtn');
            const editPasswordBtn = passwordSection.querySelector('.editPasswordBtn');
            const deletePasswordBtn = passwordSection.querySelector('.deletePasswordBtn');

            savePasswordBtn.addEventListener('click', () => {
                const data = {
                    id: uniqueId,
                    title: passwordSection.querySelector('input:nth-child(1)').value,
                    username: passwordSection.querySelector('input:nth-child(2)').value,
                    password: passwordSection.querySelector('input:nth-child(3)').value
                };
                socket.emit('savePassword', data);
                togglePasswordEditable(passwordSection, false);
            });

            editPasswordBtn.addEventListener('click', () => {
                togglePasswordEditable(passwordSection, true);
            });

            deletePasswordBtn.addEventListener('click', () => {
                socket.emit('deletePassword', uniqueId);
            });
        }

        function togglePasswordEditable(section, isEditable) {
            section.querySelector('input:nth-child(1)').readOnly = !isEditable;
            section.querySelector('input:nth-child(2)').readOnly = !isEditable;
            section.querySelector('input:nth-child(3)').readOnly = !isEditable;
            section.querySelector('.savePasswordBtn').style.display = isEditable ? '' : 'none';
            section.querySelector('.editPasswordBtn').style.display = isEditable ? 'none' : '';
        }
    </script>
</body>
</html>
